name: Build & Release

# v1.0.2 — bundle Python/yt-dlp/ffmpeg via PyInstaller

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '替换哪个 Release 的安装包（如 V1.0.0）'
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: windows-latest
            platform: win
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install flask pyinstaller

      - name: Build Flask server with PyInstaller
        working-directory: app
        run: pyinstaller mediadrop-server.spec --distpath ../bin-dist

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p bundled-bin
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            curl -L -o bundled-bin/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
            chmod +x bundled-bin/yt-dlp
          else
            curl -L -o bundled-bin/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          fi

      - name: Download ffmpeg
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            brew install ffmpeg
            cp "$(brew --prefix ffmpeg)/bin/ffmpeg" bundled-bin/ffmpeg
          else
            # Windows: use BtbN FFmpeg builds (static, GPL, essentials)
            curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
            7z x ffmpeg.zip -obundled-ffmpeg
            cp bundled-ffmpeg/*/bin/ffmpeg.exe bundled-bin/ffmpeg.exe
          fi

      - name: Copy PyInstaller output to bundled-bin
        shell: bash
        run: |
          # onedir: bin-dist/mediadrop-server/ is a directory with exe + all DLLs
          cp -r bin-dist/mediadrop-server/* bundled-bin/
          chmod +x bundled-bin/mediadrop-server 2>/dev/null || true

      - name: Install Node dependencies
        run: npm install

      - name: Build macOS DMG
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Build Windows EXE
        if: matrix.platform == 'win'
        run: npx electron-builder --win --${{ matrix.arch }}

      - name: Rename Windows ARM64 exe
        if: matrix.platform == 'win' && matrix.arch == 'arm64'
        shell: bash
        run: |
          for f in dist/*.exe; do
            [ -f "$f" ] && mv "$f" "${f%.exe}.arm64.exe"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete old assets from existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          echo "Replacing assets on release: $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | while read -r name; do
            gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
