name: Build & Release

env:
  YTDLP_VERSION: '2026.07.04'

on:
  push:
    tags:
      - 'V*-community.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '替换哪个 Release 的安装包（如 V1.0.0）'
        required: true
      platforms:
        description: '构建哪些平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r app/requirements.txt
      - run: npm test

  build-mac:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mac')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install flask pyinstaller

      - name: Build Flask server with PyInstaller
        working-directory: app
        run: pyinstaller mediadrop-server.spec --distpath ../bin-dist

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p bundled-bin
          curl --fail --location --retry 3 -o bundled-bin/yt-dlp_macos "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_macos"
          curl --fail --location --retry 3 -o bundled-bin/SHA2-256SUMS "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/SHA2-256SUMS"
          (cd bundled-bin && grep '  yt-dlp_macos$' SHA2-256SUMS | shasum -a 256 -c -)
          mv bundled-bin/yt-dlp_macos bundled-bin/yt-dlp
          # Trim universal binary to arm64-only to avoid macOS "Intel chip" warning
          lipo bundled-bin/yt-dlp -thin arm64 -output bundled-bin/yt-dlp 2>/dev/null || true
          chmod +x bundled-bin/yt-dlp

      - name: Download ffmpeg (static arm64 build)
        shell: bash
        run: |
          mkdir -p bundled-bin
          curl --fail --location --retry 3 -o bundled-bin/ffmpeg.gz "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
          gunzip -f bundled-bin/ffmpeg.gz
          chmod +x bundled-bin/ffmpeg

      - name: Copy PyInstaller output to bundled-bin
        shell: bash
        run: |
          cp -r bin-dist/mediadrop-server/* bundled-bin/
          chmod +x bundled-bin/mediadrop-server

      - name: Verify hard-subtitle runtime
        shell: bash
        run: |
          bundled-bin/ffmpeg -hide_banner -filters 2>&1 | grep -E ' (ass|subtitles) '
          bundled-bin/ffmpeg -hide_banner -encoders 2>&1 | grep -E 'libx264|libvpx-vp9'
          bundled-bin/ffmpeg -hide_banner -encoders 2>&1 | grep 'h264_videotoolbox'
          test -f bundled-bin/_internal/fonts/Roboto-Medium.ttf
          test -f bundled-bin/_internal/fonts/NotoSansCJKsc-Regular.otf
          test -f bundled-bin/_internal/fonts/Roboto-OFL.txt
          test -f bundled-bin/_internal/fonts/NotoSansCJK-OFL.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-mac-arm64
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    needs: test
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'win'
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            ffmpeg_arch: win64
          - arch: arm64
            runner: windows-11-arm
            ffmpeg_arch: winarm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install flask pyinstaller

      - name: Build Flask server with PyInstaller
        working-directory: app
        run: pyinstaller mediadrop-server.spec --distpath ../bin-dist

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p bundled-bin
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ASSET="yt-dlp_arm64.exe"
          else
            ASSET="yt-dlp.exe"
          fi
          curl --fail --location --retry 3 -o "bundled-bin/${ASSET}" "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/${ASSET}"
          curl --fail --location --retry 3 -o bundled-bin/SHA2-256SUMS "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/SHA2-256SUMS"
          (cd bundled-bin && grep "  ${ASSET}$" SHA2-256SUMS | sha256sum -c -)
          if [ "$ASSET" != "yt-dlp.exe" ]; then mv "bundled-bin/${ASSET}" bundled-bin/yt-dlp.exe; fi

      - name: Download ffmpeg (static build)
        shell: bash
        run: |
          mkdir -p bundled-bin
          curl --fail --location --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-${{ matrix.ffmpeg_arch }}-gpl.zip"
          7z x ffmpeg.zip -obundled-ffmpeg
          cp bundled-ffmpeg/*/bin/ffmpeg.exe bundled-bin/ffmpeg.exe

      - name: Verify native download tools
        shell: bash
        run: |
          bundled-bin/yt-dlp.exe --version
          bundled-bin/ffmpeg.exe -version

      - name: Copy PyInstaller output to bundled-bin
        shell: bash
        run: |
          cp -r bin-dist/mediadrop-server/* bundled-bin/
          chmod +x bundled-bin/mediadrop-server 2>/dev/null || true

      - name: Verify hard-subtitle runtime
        shell: bash
        run: |
          bundled-bin/ffmpeg.exe -hide_banner -filters 2>&1 | grep -E ' (ass|subtitles) '
          bundled-bin/ffmpeg.exe -hide_banner -encoders 2>&1 | grep -E 'libx264|libvpx-vp9'
          bundled-bin/ffmpeg.exe -hide_banner -encoders 2>&1 | grep -E 'h264_(nvenc|qsv|amf)'
          test -f bundled-bin/_internal/fonts/Roboto-Medium.ttf
          test -f bundled-bin/_internal/fonts/NotoSansCJKsc-Regular.otf
          test -f bundled-bin/_internal/fonts/Roboto-OFL.txt
          test -f bundled-bin/_internal/fonts/NotoSansCJK-OFL.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npx electron-builder --win --${{ matrix.arch }}

      - name: Rename Windows ARM64 exe
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          for f in dist/*.exe; do
            [ -f "$f" ] && mv "$f" "${f%.exe}.arm64.exe"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-win-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [test, build-mac, build-win]
    if: >-
      always() && !cancelled() && !failure() &&
      (needs.build-mac.result == 'success' || needs.build-win.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release notes
        shell: bash
        run: |
          awk 'BEGIN { section=0 } /^## / { if (section) exit; section=1 } section { print }' CHANGELOG.md > release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: artifacts/**/*
