name: Build & Release

env:
  YTDLP_VERSION: '2026.07.04'

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '替换哪个 Release 的安装包（如 V1.0.0）'
        required: true
      platforms:
        description: '构建哪些平台'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win

jobs:
  build-mac:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'mac')
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install flask pyinstaller

      - name: Build Flask server with PyInstaller
        working-directory: app
        run: pyinstaller mediadrop-server.spec --distpath ../bin-dist

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p bundled-bin
          curl --fail --location --retry 3 -o bundled-bin/yt-dlp "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_macos"
          # Trim universal binary to arm64-only to avoid macOS "Intel chip" warning
          lipo bundled-bin/yt-dlp -thin arm64 -output bundled-bin/yt-dlp 2>/dev/null || true
          chmod +x bundled-bin/yt-dlp

      - name: Download ffmpeg (static arm64 build)
        shell: bash
        run: |
          mkdir -p bundled-bin
          curl --fail --location --retry 3 -o bundled-bin/ffmpeg.gz "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
          gunzip -f bundled-bin/ffmpeg.gz
          chmod +x bundled-bin/ffmpeg

      - name: Copy PyInstaller output to bundled-bin
        shell: bash
        run: |
          cp -r bin-dist/mediadrop-server/* bundled-bin/
          chmod +x bundled-bin/mediadrop-server

      - name: Install Node dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-mac-arm64
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.platforms == 'all' ||
      github.event.inputs.platforms == 'win'
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install flask pyinstaller

      - name: Build Flask server with PyInstaller
        working-directory: app
        run: pyinstaller mediadrop-server.spec --distpath ../bin-dist

      - name: Download yt-dlp
        shell: bash
        run: |
          mkdir -p bundled-bin
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ASSET="yt-dlp_arm64.exe"
          else
            ASSET="yt-dlp.exe"
          fi
          curl --fail --location --retry 3 -o bundled-bin/yt-dlp.exe "https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/${ASSET}"

      - name: Download ffmpeg (static build)
        shell: bash
        run: |
          mkdir -p bundled-bin
          curl --fail --location --retry 3 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          7z x ffmpeg.zip -obundled-ffmpeg
          cp bundled-ffmpeg/*/bin/ffmpeg.exe bundled-bin/ffmpeg.exe

      - name: Copy PyInstaller output to bundled-bin
        shell: bash
        run: |
          cp -r bin-dist/mediadrop-server/* bundled-bin/
          chmod +x bundled-bin/mediadrop-server 2>/dev/null || true

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows EXE
        run: npx electron-builder --win --${{ matrix.arch }}

      - name: Rename Windows ARM64 exe
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          for f in dist/*.exe; do
            [ -f "$f" ] && mv "$f" "${f%.exe}.arm64.exe"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-win-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [build-mac, build-win]
    if: >-
      always() && !cancelled() && !failure() &&
      (needs.build-mac.result == 'success' || needs.build-win.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete old assets from existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          echo "Replacing assets on release: $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | while read -r name; do
            gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: artifacts/**/*
