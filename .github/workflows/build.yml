name: Build & Release

on:
  push:
    tags:
      - 'V*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '替换哪个 Release 的安装包（如 V1.0.0）'
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: windows-latest
            platform: win
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --${{ matrix.arch }}

      - name: Build Windows EXE
        if: matrix.platform == 'win'
        run: npx electron-builder --win --${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete old assets from existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          echo "Replacing assets on release: $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | while read -r name; do
            gh release delete-asset "$TAG" "$name" --repo "${{ github.repository }}" --yes
          done

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
