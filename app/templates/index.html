<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaDrop — 免费媒体下载器</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f2;
      --fg: #292b29;
      --accent: #e85d2a;
      --accent-hover: #d04e1f;
      --muted: #777b75;
      --card: #fff;
      --card-border: #dfe2dd;
      --soft: #f7f8f6;
      --success: #2d8a4e;
      --error: #c43d3d;
      --radius: 8px;
      --shimmer: linear-gradient(90deg, #ebe8e2 25%, #f0ede7 50%, #ebe8e2 75%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 32px 72px;
    }

    .app-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 38px;
    }
    .brand { min-width: 0; }
    .brand h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 4.2rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1;
      color: var(--fg);
    }
    .brand h1 em { font-style: italic; color: var(--accent); }
    .brand p {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .settings-launcher {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
      font: 600 0.76rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(28, 32, 28, 0.04);
    }
    .settings-launcher:hover { border-color: #bfc4bd; background: var(--soft); }
    .settings-launcher .gear { font-size: 1rem; line-height: 1; }

    .url-composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 132px;
      align-items: stretch;
      gap: 10px;
    }

    textarea {
      width: 100%;
      padding: 18px 20px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--fg);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      resize: none;
      min-height: 56px;
      transition: border-color 0.25s, box-shadow 0.25s;
      margin-bottom: 0;
    }
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(232, 93, 42, 0.08);
    }
    textarea::placeholder { color: var(--muted); }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin: 8px 0 20px;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 6px;
      align-items: center;
    }

    .fetch-btn {
      width: 100%;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    .fetch-btn:hover { background: var(--accent-hover); }
    .fetch-btn:active { transform: scale(0.98); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Cards */
    .cards { margin-top: 24px; }

    .card {
      display: flex;
      gap: 14px;
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius);
      background: var(--card);
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(28, 32, 28, 0.03);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-thumb {
      width: 120px;
      min-width: 120px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--card-border);
      flex-shrink: 0;
      position: relative;
    }
    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* No-thumbnail icon */
    .card-thumb .no-thumb {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .card-thumb .no-thumb svg {
      width: 28px;
      height: 28px;
      opacity: 0.5;
    }

    /* Shimmer skeleton for loading state */
    .card-thumb.loading {
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line {
      height: 12px;
      border-radius: 4px;
      background: var(--shimmer);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      margin-bottom: 6px;
    }
    .skeleton-line.short { width: 40%; height: 10px; }
    .skeleton-line.medium { width: 75%; }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card-title {
      font-family: 'Instrument Serif', serif;
      font-size: 1rem;
      line-height: 1.3;
      color: var(--fg);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-meta {
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .card-actions .card-status.downloading {
      flex: 1;
      min-width: 0;
    }

    .card-dl-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 7px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .card-dl-btn:hover { background: #2d2d2a; }
    .card-dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-dl-btn.done { background: var(--success); color: #fff; }
    .card-dl-btn.error { background: var(--error); color: #fff; }

    .card-status {
      font-size: 0.68rem;
      color: var(--muted);
    }
    .card-status.downloading { color: var(--accent); }
    .card-status.done { color: var(--success); }
    .card-status.error { color: var(--error); }

    .q-chip {
      padding: 4px 10px;
      border: 1.5px solid var(--card-border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .q-chip.active {
      border-color: var(--fg);
      color: var(--fg);
      background: rgba(26,26,24,0.04);
    }
    .q-chip:hover:not(.active) { border-color: var(--muted); }

    .fmt-pills {
      display: flex;
      gap: 0;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .fmt-pill {
      padding: 6px 14px;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .fmt-pill.active { background: var(--fg); color: var(--bg); }
    .fmt-pill:not(.active):hover { color: var(--fg); }

    .quality-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 6px;
    }
    .range-pills {
      display: flex;
      gap: 0;
      border: 1.5px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      margin-top: 6px;
    }
    .range-pill {
      flex: 1;
      min-width: 0;
      padding: 5px 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .range-pill.active { background: var(--fg); color: var(--bg); }
    .range-pill:not(.active):hover { color: var(--fg); }
    .range-pill:disabled { opacity: 0.4; cursor: not-allowed; }

    .done-btns {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .card-dl-btn.small {
      padding: 4px 10px;
      font-size: 0.6rem;
    }
    .card-dl-btn.cancel {
      background: transparent;
      color: var(--error);
      border: 1px solid var(--error);
    }
    .dl-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }

    /* Error card */
    .card.card-error {
      border-color: rgba(196, 61, 61, 0.2);
      background: rgba(196, 61, 61, 0.03);
    }
    .card-error-icon {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(196, 61, 61, 0.08);
      color: var(--error);
    }
    .card-error-icon svg {
      width: 24px;
      height: 24px;
    }
    .card-error-msg {
      font-size: 0.72rem;
      color: var(--error);
      margin-top: 2px;
      line-height: 1.4;
    }
    .card-error-url {
      font-size: 0.65rem;
      color: var(--muted);
      word-break: break-all;
      margin-top: 4px;
    }

    /* Download all bar */
    .dl-all-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .dl-all-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .dl-all-btn:hover { background: #2d2d2a; }
    .dl-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .spin {
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    /* Settings drawer */
    .settings-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(25, 28, 25, 0.28);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .settings-backdrop.open { opacity: 1; visibility: visible; }
    .settings-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 41;
      width: min(420px, 100vw);
      height: 100vh;
      background: var(--card);
      border-left: 1px solid var(--card-border);
      box-shadow: -16px 0 48px rgba(23, 27, 23, 0.12);
      transform: translateX(100%);
      transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
    }
    .settings-drawer.open { transform: translateX(0); }
    body.drawer-open { overflow: hidden; }
    .drawer-header {
      min-height: 66px;
      padding: 0 20px 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .drawer-header h2 { font-size: 1rem; font-weight: 650; }
    .icon-btn {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 1.35rem;
      cursor: pointer;
    }
    .icon-btn:hover { background: var(--soft); color: var(--fg); }
    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 24px 24px;
    }
    .settings-section { padding: 22px 0; border-bottom: 1px solid var(--card-border); }
    .settings-section:last-child { border-bottom: 0; }
    .settings-section h3 { margin-bottom: 14px; font-size: 0.78rem; font-weight: 700; color: var(--fg); }
    .field { display: block; margin-top: 14px; }
    .field:first-of-type { margin-top: 0; }
    .field-label { display: block; margin-bottom: 7px; font-size: 0.72rem; font-weight: 600; color: var(--muted); }
    .field-control { display: flex; gap: 8px; align-items: stretch; }
    .field-control input,
    .field-control select {
      min-width: 0;
      flex: 1;
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--card-border);
      border-radius: 7px;
      background: var(--soft);
      color: var(--fg);
      font: 0.78rem/1.2 'DM Mono', monospace;
      outline: none;
    }
    .field-control select { font-family: inherit; }
    .field-control input:focus,
    .field-control select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 93, 42, 0.08); }
    .secondary-btn,
    .primary-btn {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 7px;
      font: 600 0.72rem/1 inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .secondary-btn { border: 1px solid var(--card-border); background: var(--card); color: var(--fg); }
    .secondary-btn:hover { background: var(--soft); border-color: #bdc2bb; }
    .primary-btn { border: 1px solid var(--fg); background: var(--fg); color: #fff; }
    .primary-btn:hover { background: #181a18; }
    .field-help { margin-top: 7px; color: var(--muted); font-size: 0.69rem; line-height: 1.45; }
    .settings-drop.drag-over input { border-color: var(--accent); background: rgba(232, 93, 42, 0.04); }
    .conditional-field[hidden] { display: none; }
    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      font-size: 0.73rem;
    }
    .status-line strong { font-family: 'DM Mono', monospace; font-size: 0.7rem; font-weight: 500; }
    .tool-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .settings-msg {
      position: sticky;
      bottom: 0;
      min-height: 42px;
      padding: 12px 24px;
      border-top: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.96);
      color: var(--muted);
      font-size: 0.72rem;
    }
    .settings-msg:empty { display: none; }
    .settings-msg.ok { color: var(--success); }
    .settings-msg.err { color: var(--error); }

    /* Progress bar */
    .dl-progress { margin-top: 8px; }
    .progress-bar-bg {
      height: 6px;
      background: var(--card-border);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 4px;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .progress-info span:last-child { text-align: right; }

    /* Mobile */
    @media (max-width: 500px) {
      .brand h1 { font-size: 3rem; }
      .page { padding: 40px 16px 60px; }
      .app-header { margin-bottom: 28px; }
      .settings-launcher { width: 38px; padding: 0; justify-content: center; }
      .settings-launcher .label { display: none; }
      .url-composer { grid-template-columns: 1fr; }
      .url-composer .fetch-btn { min-height: 44px; }
      .card { flex-direction: column; gap: 10px; }
      .card-thumb {
        width: 100%;
        min-width: unset;
        height: 160px;
      }
      .card-title { white-space: normal; }
      .controls { flex-wrap: wrap; }
      .fetch-btn { width: 100%; }
      .drawer-content { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="brand">
        <h1>Media<em>Drop</em></h1>
        <p>免费媒体下载器</p>
      </div>
      <button class="settings-launcher" id="settingsLauncher" onclick="openSettings()" aria-label="设置" aria-haspopup="dialog" aria-controls="settingsDrawer">
        <span class="gear" aria-hidden="true">&#9881;</span>
        <span class="label">设置</span>
      </button>
    </header>

    <div class="url-composer">
      <textarea id="urls" placeholder="粘贴一个或多个媒体链接..." rows="2"></textarea>
      <button class="fetch-btn" id="goBtn" onclick="go()">解析链接</button>
    </div>
    <p class="hint">多个链接可使用空格、逗号或换行分隔。</p>

    <div id="cards" class="cards"></div>

    <div class="footer">
      YouTube &middot; TikTok &middot; Instagram &middot; Twitter/X &middot; Reddit &middot; Facebook<br>
      Vimeo &middot; Twitch &middot; Dailymotion &middot; SoundCloud &middot; Loom &middot; Streamable<br>
      Pinterest &middot; Tumblr &middot; Threads &middot; LinkedIn &middot; 另支持 1000+ 网站
    </div>
  </div>

  <div class="settings-backdrop" id="settingsBackdrop" onclick="closeSettings()"></div>
  <aside class="settings-drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
    <div class="drawer-header">
      <h2 id="settingsTitle">设置</h2>
      <button class="icon-btn" onclick="closeSettings()" title="关闭设置" aria-label="关闭设置">&times;</button>
    </div>
    <div class="drawer-content">
      <section class="settings-section">
        <h3>下载位置</h3>
        <label class="field settings-drop" id="dropZone">
          <span class="field-label">保存文件夹</span>
          <span class="field-control">
            <input id="dlPath" type="text" placeholder="选择下载文件夹" onblur="savePath()">
            <button class="secondary-btn" type="button" onclick="browsePath()">选择</button>
          </span>
          <span class="field-help">可以选择或粘贴路径，也可以把文件夹拖放到此处。</span>
        </label>
      </section>

      <section class="settings-section">
        <h3>网络</h3>
        <label class="field">
          <span class="field-label">代理地址</span>
          <span class="field-control">
            <input id="proxyUrl" type="text" placeholder="不使用代理" onblur="saveProxy()">
            <button class="secondary-btn" type="button" onclick="autoDetectProxy()">自动检测</button>
          </span>
          <span class="field-help">留空时将直接连接网络。</span>
        </label>
      </section>

      <section class="settings-section">
        <h3>YouTube 登录</h3>
        <label class="field">
          <span class="field-label">认证方式</span>
          <span class="field-control">
            <select id="authMode" onchange="changeAuthMode()">
              <option value="none">不使用 Cookie</option>
              <option value="browser">使用浏览器 Cookie</option>
              <option value="file">使用 cookies.txt</option>
            </select>
          </span>
        </label>
        <label class="field conditional-field" id="browserCookieField" hidden>
          <span class="field-label">已登录的浏览器</span>
          <span class="field-control">
            <select id="cookiesBrowser" onchange="saveCookies()">
              <option value="chrome">Chrome</option>
              <option value="firefox">Firefox</option>
              <option value="edge">Edge</option>
              <option value="brave">Brave</option>
              <option value="opera">Opera</option>
              <option value="vivaldi">Vivaldi</option>
            </select>
          </span>
          <span class="field-help">macOS 暂不支持从 Safari 提取 Cookie。</span>
        </label>
        <label class="field conditional-field" id="cookieFileField" hidden>
          <span class="field-label">Cookie 文件</span>
          <span class="field-control">
            <input id="cookiesFile" type="text" placeholder="选择 cookies.txt" onblur="saveCookieFile()">
            <button class="secondary-btn" type="button" onclick="browseCookieFile()">选择</button>
          </span>
        </label>
        <div class="tool-actions" style="margin-top:14px">
          <button class="secondary-btn" type="button" onclick="testCookies()">测试登录状态</button>
        </div>
      </section>

      <section class="settings-section">
        <h3>维护工具</h3>
        <div class="status-line">
          <span>yt-dlp</span>
          <strong id="ytdlpVersion">尚未检查</strong>
        </div>
        <div class="tool-actions">
          <button class="secondary-btn" type="button" onclick="checkYtdlp()">检查更新</button>
          <button class="primary-btn" id="updateYtdlpBtn" type="button" onclick="updateYtdlp()" hidden>更新 yt-dlp</button>
        </div>
      </section>
    </div>
    <div class="settings-msg" id="settingsMsg" role="status" aria-live="polite"></div>
  </aside>

  <script>
    let cardData = [];

    // Settings
    let settingsLoaded = false;
    let settingsMessageTimer = null;

    function openSettings() {
      document.getElementById('settingsDrawer').classList.add('open');
      document.getElementById('settingsBackdrop').classList.add('open');
      document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'false');
      document.body.classList.add('drawer-open');
      if (!settingsLoaded) loadSettings();
      setTimeout(() => document.querySelector('#settingsDrawer .icon-btn').focus(), 50);
    }

    function closeSettings() {
      document.getElementById('settingsDrawer').classList.remove('open');
      document.getElementById('settingsBackdrop').classList.remove('open');
      document.getElementById('settingsDrawer').setAttribute('aria-hidden', 'true');
      document.body.classList.remove('drawer-open');
      document.getElementById('settingsLauncher').focus();
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.getElementById('settingsDrawer').classList.contains('open')) {
        closeSettings();
      }
    });

    function updateAuthFields() {
      const mode = document.getElementById('authMode').value;
      document.getElementById('browserCookieField').hidden = mode !== 'browser';
      document.getElementById('cookieFileField').hidden = mode !== 'file';
    }

    async function loadSettings() {
      try {
        const res = await fetch('/api/config');
        const data = await res.json();
        document.getElementById('dlPath').value = data.download_dir || '';
        document.getElementById('proxyUrl').value = data.proxy_url || '';
        document.getElementById('cookiesBrowser').value = data.cookies_browser || 'chrome';
        document.getElementById('cookiesFile').value = data.cookies_file || '';
        document.getElementById('authMode').value = data.cookies_file ? 'file' : data.cookies_browser ? 'browser' : 'none';
        updateAuthFields();
        settingsLoaded = true;
      } catch (err) {
        setSettingsMsg('err', `无法加载设置：${friendlyError(err.message)}`);
      }
    }

    async function postConfig(updates, successText) {
      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updates),
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Could not save settings');
        setSettingsMsg('ok', successText || '已自动保存', true);
        return data;
      } catch (err) {
        setSettingsMsg('err', friendlyError(err.message));
        return null;
      }
    }

    async function savePath() {
      const input = document.getElementById('dlPath');
      const data = await postConfig({ download_dir: input.value }, '下载文件夹已保存');
      if (data) input.value = data.download_dir || '';
    }

    async function saveProxy() {
      const input = document.getElementById('proxyUrl');
      const data = await postConfig({ proxy_url: input.value }, input.value ? '代理设置已保存' : '已切换为直接连接');
      if (data) input.value = data.proxy_url || '';
    }

    async function changeAuthMode() {
      const mode = document.getElementById('authMode').value;
      updateAuthFields();
      if (mode === 'none') {
        await postConfig({ cookies_browser: '', cookies_file: '' }, '已停用 YouTube Cookie');
      } else if (mode === 'browser') {
        await postConfig({ cookies_browser: document.getElementById('cookiesBrowser').value || 'chrome', cookies_file: '' }, '已启用浏览器 Cookie');
      } else {
        await postConfig({ cookies_browser: '' }, '已启用 cookies.txt 认证');
      }
    }

    async function saveCookies() {
      const browser = document.getElementById('cookiesBrowser').value;
      await postConfig({ cookies_browser: browser, cookies_file: '' }, `已选择 ${browser} Cookie`);
    }

    async function saveCookieFile() {
      const input = document.getElementById('cookiesFile');
      const data = await postConfig({ cookies_file: input.value, cookies_browser: '' }, input.value ? 'Cookie 文件已保存' : 'Cookie 文件已清除');
      if (data) input.value = data.cookies_file || '';
    }

    async function autoDetectProxy() {
      const input = document.getElementById('proxyUrl');
      if (!window.electronAPI || !window.electronAPI.detectProxy) {
        setSettingsMsg('err', '自动检测代理仅可在桌面应用中使用');
        return;
      }
      const proxy = await window.electronAPI.detectProxy();
      if (!proxy) {
        setSettingsMsg('err', '未检测到可用代理', true);
        return;
      }
      input.value = proxy;
      await saveProxy();
    }

    async function browsePath() {
      if (!window.electronAPI || !window.electronAPI.selectFolder) {
        setSettingsMsg('err', '选择文件夹仅可在桌面应用中使用');
        return;
      }
      const folder = await window.electronAPI.selectFolder();
      if (folder) {
        document.getElementById('dlPath').value = folder;
        await savePath();
      }
    }

    async function browseCookieFile() {
      if (!window.electronAPI || !window.electronAPI.selectCookieFile) {
        setSettingsMsg('err', '选择文件仅可在桌面应用中使用');
        return;
      }
      const file = await window.electronAPI.selectCookieFile();
      if (file) {
        document.getElementById('cookiesFile').value = file;
        await saveCookieFile();
      }
    }

    function setSettingsMsg(kind, message, autoClear = false) {
      const msg = document.getElementById('settingsMsg');
      clearTimeout(settingsMessageTimer);
      msg.className = `settings-msg ${kind}`;
      msg.textContent = message;
      if (autoClear) settingsMessageTimer = setTimeout(() => { msg.textContent = ''; }, 2400);
    }

    async function testCookies() {
      setSettingsMsg('', '正在测试 YouTube 登录状态...');
      try {
        const firstUrl = parseUrls(document.getElementById('urls').value)[0] || '';
        const res = await fetch('/api/test-cookies', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: firstUrl }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          setSettingsMsg('err', friendlyError(data.error || 'Cookie test failed'));
        } else {
          const source = data.using_cookies ? '已配置 Cookie' : '未使用 Cookie';
          setSettingsMsg('ok', `YouTube 登录状态正常（${source}）`);
        }
      } catch (err) {
        setSettingsMsg('err', friendlyError(err.message));
      }
    }

    async function checkYtdlp() {
      const version = document.getElementById('ytdlpVersion');
      const updateButton = document.getElementById('updateYtdlpBtn');
      version.textContent = '正在检查...';
      setSettingsMsg('', '正在检查 yt-dlp 更新...');
      try {
        const res = await fetch('/api/ytdlp/version');
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Could not check yt-dlp');
        version.textContent = data.current || '未知版本';
        updateButton.hidden = !data.update_available;
        const status = data.update_available ? `发现新版本 ${data.latest || ''}` : 'yt-dlp 已是最新版本';
        setSettingsMsg(data.update_available ? '' : 'ok', status);
      } catch (err) {
        version.textContent = '检查失败';
        setSettingsMsg('err', friendlyError(err.message));
      }
    }

    async function updateYtdlp() {
      setSettingsMsg('', '正在更新 yt-dlp...');
      try {
        const res = await fetch('/api/ytdlp/update', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'yt-dlp update failed');
        const current = data.version || data.latest || '最新版本';
        document.getElementById('ytdlpVersion').textContent = current;
        document.getElementById('updateYtdlpBtn').hidden = true;
        setSettingsMsg('ok', `yt-dlp 已更新至 ${current}`);
      } catch (err) {
        setSettingsMsg('err', friendlyError(err.message));
      }
    }

    // Drag and drop
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('drag-over');
    });
    dropZone.addEventListener('dragleave', e => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');
    });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (files.length) {
        let filePath = null;
        if (window.electronAPI && window.electronAPI.getPathForFile) {
          filePath = window.electronAPI.getPathForFile(files[0]);
        } else {
          filePath = files[0].path;
        }
        if (filePath) {
          document.getElementById('dlPath').value = filePath;
          savePath();
        }
      }
    });

    function fmtSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      let size = bytes;
      while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
      return `${size.toFixed(i > 0 ? 1 : 0)} ${units[i]}`;
    }

    function fmtSpeed(bytesPerSecond, fallback) {
      if (Number.isFinite(bytesPerSecond) && bytesPerSecond > 0) {
        return `${fmtSize(bytesPerSecond)}/秒`;
      }
      return fallback || '';
    }

    function roundedEta(seconds) {
      const bucket = seconds < 120 ? 5 : seconds < 600 ? 15 : 60;
      return Math.max(bucket, Math.round(seconds / bucket) * bucket);
    }

    function fmtEtaDuration(seconds) {
      seconds = Math.max(0, Math.round(seconds));
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      if (hours) return `${hours} 小时 ${minutes} 分`;
      if (minutes) return secs ? `${minutes} 分 ${secs} 秒` : `${minutes} 分钟`;
      return `${secs} 秒`;
    }

    function progressPhaseLabel(phase) {
      const labels = {
        merging: '正在合并音视频',
        converting_audio: '正在转换 MP3',
        converting_thumbnail: '正在转换封面',
        postprocessing: '正在处理媒体',
        complete: '处理完成',
      };
      return labels[phase] || '';
    }

    function fmtEtaEstimate(progress, isPaused) {
      if (isPaused || progress.state === 'paused') return '估算已暂停';
      const phaseLabel = progressPhaseLabel(progress.phase);
      if (phaseLabel) return phaseLabel;
      if (progress.state === 'stalled') return '网络波动，正在重新估算';

      const seconds = Number(progress.eta_seconds);
      if (!Number.isFinite(seconds) || seconds <= 0 || progress.state === 'estimating') {
        return '正在估算剩余时间';
      }
      if (progress.eta_confidence === 'medium') {
        const lower = roundedEta(seconds * 0.85);
        const upper = Math.max(lower, roundedEta(seconds * 1.2));
        return `预计 ${fmtEtaDuration(lower)} 至 ${fmtEtaDuration(upper)}`;
      }
      return `预计剩余 ${fmtEtaDuration(roundedEta(seconds))}`;
    }

    function setCardFormat(idx, fmt) {
      cardData[idx].format = fmt;
      renderCard(idx);
    }

    function currentCardFormat(idx) {
      const active = document.querySelector(`#card-${idx} .fmt-pill.active`);
      const fmt = active ? active.dataset.format : '';
      if (fmt) {
        cardData[idx].format = fmt;
        return fmt;
      }
      return cardData[idx].format || 'video';
    }

    function buildDownloadRequest(card, format = card.format || 'video') {
      return {
        format,
        formatId: format === 'video' ? (card.selectedFormatId || null) : null,
        videoRangeMode: format === 'video' ? (card.videoRangeMode || 'auto') : null,
      };
    }

    function downloadRequestKey(request) {
      return JSON.stringify([
        request.format,
        request.formatId || null,
        request.formatId ? null : request.videoRangeMode || null,
      ]);
    }

    function completedDownloadFor(card, format = card.format || 'video') {
      const key = downloadRequestKey(buildDownloadRequest(card, format));
      return card.completedDownloads?.[key] || null;
    }

    function parseUrls(text) {
      return [...new Set(text.split(/[\s,]+/).map(u => u.trim()).filter(u => u.startsWith('http')))];
    }

    function fmtDur(s) {
      if (!s) return '';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function friendlyError(err) {
      err = String(err || '未知错误');
      if (err.includes('Unsupported URL')) return '暂不支持此链接';
      if (err.includes('Video unavailable') || err.includes('not available')) return '视频不可用或属于私密内容';
      if (err.includes('Private video')) return '这是一个私密视频';
      if (err.includes('HTTP Error 403')) return '访问被拒绝，请稍后重试';
      if (err.includes('HTTP Error 404')) return '未找到该视频';
      if (err.includes('Sign in to confirm')) return 'YouTube 需要登录认证，请在设置中选择已登录的浏览器或 cookies.txt';
      if (err.includes('Operation not permitted') && err.includes('Safari')) return '暂不支持 Safari，请登录 Chrome 或 Firefox 后在设置中选择对应浏览器';
      if (err.toLowerCase().includes('cookies')) return 'Cookie 无效，请确认浏览器已登录 YouTube，或导入有效的 cookies.txt';
      if (err.toLowerCase().includes('copyright')) return '视频因版权限制而无法下载';
      if (err.toLowerCase().includes('geo')) return '当前地区无法播放此视频';
      if (err.includes('timed out') || err.includes('Timed out')) return '请求超时，请重试';
      if (err.includes('network') || err.includes('Network') || err.includes('Failed to fetch')) return '网络连接失败，请检查网络或代理设置';
      if (err.includes('Could not load settings')) return '无法加载设置';
      if (err.includes('Could not save settings')) return '无法保存设置';
      if (err.includes('Cookie file does not exist')) return '所选 Cookie 文件不存在';
      if (err.includes('Unsupported browser')) return '不支持所选浏览器';
      if (err.includes('Download directory')) return '下载文件夹无效或无法访问';
      if (err.includes('Cookie test failed')) return 'Cookie 测试失败';
      if (err.includes('Could not check yt-dlp')) return '无法检查 yt-dlp 更新';
      if (err.includes('Could not check latest yt-dlp release')) return '无法获取最新的 yt-dlp 版本信息';
      if (err.includes('Could not download yt-dlp')) return '无法下载 yt-dlp 更新';
      if (err.includes('yt-dlp update failed')) return 'yt-dlp 更新失败';
      if (err.includes('Lost connection to server')) return '与下载服务的连接已中断';
      if (err.includes('Connection lost')) return '连接已中断，请重试';
      if (err.includes('No URL provided')) return '请先输入媒体链接';
      if (err.includes('Invalid URL')) return '链接格式无效';
      if (err.includes('Invalid video range mode')) return '动态范围选项无效';
      if (err.includes('Job not found')) return '未找到下载任务';
      if (err.includes('File not ready')) return '文件尚未准备完成';
      if (err.includes('Access denied')) return '没有权限访问该文件';
      if (err.includes('Process already finished')) return '下载任务已经结束';
      if (err.includes('Timed out fetching video info')) return '解析媒体信息超时';
      if (err.includes('Timed out testing cookies')) return '测试 Cookie 超时';
      if (err.includes('Cannot create directory')) return '无法创建下载文件夹';
      if (err.includes('Download failed')) return '下载失败，请重试';
      return err.length > 120 ? err.slice(0, 120) + '...' : err;
    }

    document.getElementById('urls').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
    });

    async function go() {
      const urls = parseUrls(document.getElementById('urls').value);
      if (!urls.length) return;

      const btn = document.getElementById('goBtn');
      const container = document.getElementById('cards');
      btn.disabled = true;
      btn.textContent = '正在解析...';
      container.innerHTML = '';
      cardData = [];

      for (let i = 0; i < urls.length; i++) {
        const url = urls[i];
        const idx = cardData.length;
        cardData.push({ url, status: 'loading' });
        renderCard(idx);

        try {
          const res = await fetch('/api/info', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url }),
          });
          const data = await res.json();
          if (data.error) {
            cardData[idx] = { ...cardData[idx], status: 'info-error', error: data.error };
          } else {
            cardData[idx] = {
              ...cardData[idx],
              status: 'ready',
              format: 'video',
              title: data.title || '',
              thumbnail: data.thumbnail || '',
              duration: data.duration,
              uploader: data.uploader || '',
              formats: data.formats || [],
              defaultFormatIds: data.default_format_ids || {},
              hasHdr: Boolean(data.has_hdr),
              videoRangeMode: 'auto',
              selectedFormatId: data.default_format_ids?.auto || data.formats?.[0]?.id || null,
              completedDownloads: {},
            };
          }
        } catch (err) {
          cardData[idx] = { ...cardData[idx], status: 'info-error', error: err.message };
        }
        renderCard(idx);
      }

      if (cardData.filter(c => c.status === 'ready').length > 1) {
        renderDownloadAll();
      }

      btn.disabled = false;
      btn.textContent = '解析链接';
    }

    function renderCard(idx) {
      const c = cardData[idx];
      let el = document.getElementById(`card-${idx}`);
      if (!el) {
        el = document.createElement('div');
        el.id = `card-${idx}`;
        el.className = 'card';
        document.getElementById('cards').appendChild(el);
      }

      // Loading skeleton
      if (c.status === 'loading') {
        el.className = 'card';
        el.innerHTML = `
          <div class="card-thumb loading"></div>
          <div class="card-body">
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short"></div>
          </div>
        `;
        return;
      }

      // Error state
      if (c.status === 'info-error') {
        el.className = 'card card-error';
        el.innerHTML = `
          <div class="card-thumb">
            <div class="card-error-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title" style="color:var(--error)">无法解析媒体信息</div>
            <div class="card-error-msg">${esc(friendlyError(c.error || ''))}</div>
            <div class="card-error-url">${esc(c.url)}</div>
          </div>
        `;
        return;
      }

      // Ready / downloading / done / error states
      el.className = 'card';
      const cardFmt = c.format || 'video';
      const isAudio = cardFmt === 'audio';
      const isImage = cardFmt === 'image';

      let thumbHtml;
      if (isAudio) {
        thumbHtml = `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>`;
      } else if (isImage) {
        thumbHtml = c.thumbnail ? `<img src="${c.thumbnail}" alt="">` : `<div class="no-thumb" style="color:var(--accent)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      } else if (c.thumbnail) {
        thumbHtml = `<img src="${c.thumbnail}" alt="">`;
      } else {
        thumbHtml = `<div class="no-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`;
      }

      // Format pills
      const fmtPills = `<div class="fmt-pills">
        <button class="fmt-pill${cardFmt === 'video' ? ' active' : ''}" data-format="video" onclick="setCardFormat(${idx}, 'video')">MP4</button>
        <button class="fmt-pill${cardFmt === 'audio' ? ' active' : ''}" data-format="audio" onclick="setCardFormat(${idx}, 'audio')">MP3</button>
        <button class="fmt-pill${cardFmt === 'image' ? ' active' : ''}" data-format="image" onclick="setCardFormat(${idx}, 'image')">JPG</button>
      </div>`;

      const rangeMode = c.videoRangeMode || 'auto';
      const rangePills = `<div class="range-pills">
        <button class="range-pill${rangeMode === 'auto' ? ' active' : ''}" onclick="setVideoRangeMode(${idx}, 'auto')">自动</button>
        <button class="range-pill${rangeMode === 'hdr' ? ' active' : ''}" onclick="setVideoRangeMode(${idx}, 'hdr')"${c.hasHdr ? '' : ' disabled'}>仅 HDR</button>
        <button class="range-pill${rangeMode === 'sdr' ? ' active' : ''}" onclick="setVideoRangeMode(${idx}, 'sdr')">仅 SDR</button>
      </div>`;

      // Quality chips (only for video)
      let qualityChips = '';
      if (!isAudio && !isImage && c.formats && c.formats.length > 0) {
        const visibleFormats = rangeMode === 'hdr'
          ? c.formats.filter(f => f.hdr)
          : rangeMode === 'sdr'
            ? c.formats.filter(f => !f.hdr)
            : c.formats;
        qualityChips = visibleFormats.map(f =>
          `<button class="q-chip${f.id === c.selectedFormatId ? ' active' : ''}" onclick="pickFormat(${idx}, '${f.id}')">${esc(f.label)}</button>`
        ).join('');
      }

      let actionHtml = '';
      let progressHtml = '';

      if (c.status === 'ready') {
        actionHtml = `${fmtPills}
          ${!isAudio && !isImage ? rangePills : ''}
          ${!isAudio && !isImage && qualityChips ? '<div class="quality-row">' + qualityChips + '</div>' : ''}
          <button class="card-dl-btn" onclick="dlCard(${idx})">下载</button>`;
      } else if (c.status === 'queued') {
        progressHtml = `
          <div class="dl-controls">
            <span class="card-status downloading">等待下载</span>
            <button class="card-dl-btn small cancel" onclick="cancelDl(${idx})">取消</button>
          </div>`;
      } else if (c.status === 'downloading' || c.status === 'paused') {
        const p = c.progress || {};
        const numericPct = Number.isFinite(p.percent) ? Math.max(0, Math.min(100, p.percent)) : null;
        const pct = numericPct != null ? numericPct.toFixed(1) : '--';
        const speed = fmtSpeed(p.speed_bps, p.speed);
        const downloaded = fmtSize(p.downloaded || 0);
        const total = p.total ? fmtSize(p.total) : '';
        const isPaused = c.status === 'paused';
        const statusIcon = isPaused ? '⏸' : '<span class="spin"></span>';
        const phaseLabel = progressPhaseLabel(p.phase);
        const etaText = fmtEtaEstimate(p, isPaused);
        const progressDetail = phaseLabel ? etaText : [speed, etaText].filter(Boolean).join(' · ');
        const totalText = p.total_is_estimate ? `约 ${total}` : total;
        const statusText = isPaused
          ? '已暂停'
          : phaseLabel || (total ? `${downloaded} / ${totalText}` : downloaded !== '0 B' ? `已下载 ${downloaded}` : '正在下载');
        progressHtml = `
          <div class="dl-progress">
            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${numericPct || 0}%"></div></div>
            <div class="progress-info"><span>${pct}%</span><span>${progressDetail}</span></div>
          </div>
          <div class="dl-controls">
            <span class="card-status downloading">${statusIcon} ${statusText}</span>
            <button class="card-dl-btn small" onclick="togglePause(${idx})">${isPaused ? '继续' : '暂停'}</button>
            <button class="card-dl-btn small cancel" onclick="cancelDl(${idx})">取消</button>
          </div>`;
      } else if (c.status === 'done') {
        const completed = completedDownloadFor(c, cardFmt);
        const completionStatus = completed
          ? `<span class="card-status done">已保存：${esc(completed.filename || '')}</span>`
          : '';
        actionHtml = `${completionStatus}
          ${fmtPills}
          ${!isAudio && !isImage ? rangePills : ''}
          ${!isAudio && !isImage && qualityChips ? '<div class="quality-row">' + qualityChips + '</div>' : ''}
          <div class="done-btns">
            <button class="card-dl-btn" onclick="dlCard(${idx})">${completed ? '重新下载' : '下载'}</button>
          </div>`;
      } else if (c.status === 'error') {
        actionHtml = `${fmtPills}
          ${!isAudio && !isImage ? rangePills : ''}
          ${!isAudio && !isImage && qualityChips ? '<div class="quality-row">' + qualityChips + '</div>' : ''}
          <button class="card-dl-btn" onclick="dlCard(${idx})">重试</button>
          <span class="card-status error">${esc(friendlyError(c.error || 'Download failed'))}</span>`;
      } else if (c.status === 'cancelled') {
        actionHtml = `<span class="card-status error">已取消</span>
          ${fmtPills}
          ${!isAudio && !isImage ? rangePills : ''}
          ${!isAudio && !isImage && qualityChips ? '<div class="quality-row">' + qualityChips + '</div>' : ''}
          <button class="card-dl-btn" onclick="dlCard(${idx})">下载</button>`;
      }

      el.innerHTML = `
        <div class="card-thumb">${thumbHtml}</div>
        <div class="card-body">
          <div class="card-title">${esc(c.title || '未命名媒体')}</div>
          <div class="card-meta">${esc(c.uploader)}${c.duration ? ' · ' + fmtDur(c.duration) : ''}</div>
          <div class="card-actions">${actionHtml}</div>
          ${progressHtml}
        </div>
      `;
    }


    async function togglePause(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      try {
        const res = await fetch(`/api/pause/${c.jobId}`, { method: 'POST' });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
        } else if (data.status === 'paused') {
          c.status = 'paused';
        } else if (data.status === 'resumed') {
          c.status = 'downloading';
        }
        renderCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    async function cancelDl(idx) {
      const c = cardData[idx];
      if (!c.jobId) return;
      // Stop poll immediately to prevent race with in-flight responses
      c.cancelRequested = true;
      if (c._pollInterval) {
        clearInterval(c._pollInterval);
        c._pollInterval = null;
      }
      try {
        await fetch(`/api/cancel/${c.jobId}`, { method: 'POST' });
        c.status = 'cancelled';
        c.progress = {};
        renderCard(idx);
      } catch {}
    }

    function renderDownloadAll() {
      const existing = document.getElementById('dl-all-bar');
      if (existing) existing.remove();

      const bar = document.createElement('div');
      bar.id = 'dl-all-bar';
      bar.className = 'dl-all-bar';
      bar.innerHTML = `<button class="dl-all-btn" onclick="dlAll()">全部下载</button>`;
      document.getElementById('cards').appendChild(bar);
    }

    function pickFormat(idx, formatId) {
      cardData[idx].selectedFormatId = formatId;
      renderCard(idx);
    }

    function setVideoRangeMode(idx, mode) {
      const c = cardData[idx];
      c.videoRangeMode = mode;
      const preferred = c.defaultFormatIds?.[mode];
      if (preferred) {
        c.selectedFormatId = preferred;
      }
      renderCard(idx);
    }

    async function dlCard(idx) {
      const c = cardData[idx];
      const requestedFormat = currentCardFormat(idx);
      c.activeRequest = buildDownloadRequest(c, requestedFormat);
      c.status = 'downloading';
      c.error = null;
      c.progress = {};
      c.cancelRequested = false;
      renderCard(idx);

      try {
        const res = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: c.url,
            format: c.activeRequest.format,
            format_id: c.activeRequest.formatId,
            video_range_mode: c.activeRequest.videoRangeMode || 'auto',
            title: c.title || '',
          }),
        });
        const data = await res.json();
        if (data.error) {
          c.status = 'error';
          c.error = data.error;
          renderCard(idx);
          return;
        }
        c.jobId = data.job_id;
        pollCard(idx);
      } catch (err) {
        c.status = 'error';
        c.error = err.message;
        renderCard(idx);
      }
    }

    function pollCard(idx) {
      const c = cardData[idx];
      c._pollInterval = setInterval(async () => {
        if (c.cancelRequested) return;
        try {
          const res = await fetch(`/api/status/${c.jobId}`);
          const data = await res.json();
          // Ignore stale poll response if user cancelled while we were waiting
          if (c.cancelRequested) {
            if (data.status === 'done' || data.status === 'error' || data.status === 'cancelled') {
              clearInterval(c._pollInterval);
            }
            return;
          }
          if (data.progress) {
            c.progress = data.progress;
          }
          if (data.status === 'done') {
            clearInterval(c._pollInterval);
            const completedRequest = c.activeRequest || buildDownloadRequest(c);
            c.completedDownloads = c.completedDownloads || {};
            c.completedDownloads[downloadRequestKey(completedRequest)] = {
              filename: data.filename,
              request: completedRequest,
            };
            c.status = 'done';
            c.filename = data.filename;
            c.activeRequest = null;
            renderCard(idx);
          } else if (data.status === 'error') {
            clearInterval(c._pollInterval);
            c.status = 'error';
            c.error = data.error;
            renderCard(idx);
          } else if (data.status === 'cancelled') {
            clearInterval(c._pollInterval);
            c.status = 'cancelled';
            renderCard(idx);
          } else if (data.status === 'paused') {
            // Keep polling but don't change status (user controls it)
            c.progress = data.progress;
            renderCard(idx);
          } else if (data.status === 'queued' || data.status === 'starting') {
            c.status = data.status === 'queued' ? 'queued' : 'downloading';
            renderCard(idx);
          } else {
            c.status = 'downloading';
            renderCard(idx);
          }
        } catch {
          clearInterval(c._pollInterval);
          c.status = 'error';
          c.error = 'Lost connection to server';
          renderCard(idx);
        }
      }, 1000);
    }

    async function dlAll() {
      const btn = document.querySelector('.dl-all-btn');
      if (btn) { btn.disabled = true; btn.textContent = '正在下载...'; }

      for (let i = 0; i < cardData.length; i++) {
        if (cardData[i].status === 'ready') {
          await dlCard(i);
        }
      }

      if (btn) { btn.disabled = false; btn.textContent = '全部下载'; }
    }
  </script>
</body>
</html>
